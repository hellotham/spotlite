<svg xmlns="http://www.w3.org/2000/svg" viewBox="26 61 330 224" width="396" height="269" role="img" aria-label="Block diagram of the f function. A 32 bit input enters an E Expansion box; a 64 bit key and N enter a K block. Each sends a 48 bit bus to a circled plus marked 48 bit XOR. Its 48 bit output feeds S Boxes, then P permutation, then a 32 bit output. A note reads N.B. All buses are 32 bits unless specified">
