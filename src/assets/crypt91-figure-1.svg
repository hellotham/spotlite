<text class="t" x="264" y="109" font-family="Times, serif" font-size="11.1" text-anchor="start">48</text>
<text class="t" x="144" y="109" font-family="Times, serif" font-size="11.1" text-anchor="start">48</text>
<text class="t" x="179" y="274" font-family="Times, serif" font-size="11.1" text-anchor="start">Output</text>
<text class="t" x="179" y="264" font-family="Times, serif" font-size="11.1" text-anchor="start">32 bit</text>
<text class="t" x="164" y="214" font-family="Times, serif" font-size="11.1" text-anchor="start">P permutation</text>
